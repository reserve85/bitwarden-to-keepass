name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
        # The following rule may conflict with the formatter; keep it disabled
        # only if the project ever turns it on explicitly.

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install "pykeepass==4.1.0.post1"
      - name: Test
        run: python -m unittest discover -s tests -v

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        # Scans the latest commit only; historical issues (e.g. the .env
        # committed before v0.2) have to be purged from history manually.
        # The Go module keeps its historical import path: even though the repo now lives in the
        # 'gitleaks' org, go.mod still declares 'zricethezav/gitleaks/v8' (as of v8.30.1).
        # Keep in sync with rev: in .pre-commit-config.yaml.
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Run gitleaks (HEAD)
        run: "$(go env GOPATH)/bin/gitleaks detect --source . --log-opts=--max-count=1 --no-banner --verbose"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Install runtime dependencies
        run: pip install "pykeepass==4.1.0.post1"
      - name: Audit dependencies
        # pip-audit scans the whole environment; the runner ships a pip version with
        # published advisories, so upgrade pip first to avoid failing on pip itself.
        run: |
          python -m pip install --upgrade pip
          pip-audit
